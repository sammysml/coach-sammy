// ── SEED FUNCTION ─────────────────────────────────────────────────
async function runSeed(){
  const btn=document.getElementById('run-btn');
  btn.disabled=true;
  btn.textContent='⏳ Running...';

  const container=document.getElementById('profile-cards');
  container.innerHTML='';
  let totalInserted=0,totalFailed=0;

  for(const [clientId,prog] of Object.entries(DEMO_PROGRAMS)){
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<div class="profile-name">${prog.label}</div><div class="profile-id">${clientId}</div><div class="log" id="log-${clientId}"></div>`;
    container.appendChild(card);
    const log=document.getElementById('log-'+clientId);

    const addLog=(msg,cls='')=>{ log.innerHTML+=`<div class="${cls}">${msg}</div>`; };

    // 1. Delete existing
    addLog('🗑 Deleting existing sessions…','info');
    const {error:delErr}=await sb.from('training_sessions').delete().eq('client_id',clientId);
    if(delErr){ addLog('⚠ Delete: '+delErr.message,'err'); }
    else{ addLog('✓ Cleared','ok'); }

    // 2. Insert fresh
    const rows=prog.sessions.map(s=>({
      client_id:clientId,
      name:s.name,
      type:s.type,
      
      exercises:s.exercises,
      cardio:s.cardio,
      rest_time:s.rest_time,
    }));

    addLog(`➕ Inserting ${rows.length} sessions…`,'info');
    const {data,error:insErr}=await sb.from('training_sessions').insert(rows).select('id,name');

    if(insErr){
      addLog('❌ Insert error: '+insErr.message,'err');
      if(insErr.hint) addLog('   Hint: '+insErr.hint,'err');
      if(insErr.details) addLog('   Details: '+insErr.details,'err');
      totalFailed++;
    } else {
      data.forEach(r=>addLog(`✅ ${r.name}  <span style="color:rgba(255,255,255,.25);font-size:10px">${r.id}</span>`,'ok'));
      totalInserted+=data.length;
    }
  }

  // Summary
  const sumEl=document.getElementById('summary');
  sumEl.style.display='block';
  if(totalFailed===0){
    sumEl.style.background='rgba(74,222,128,.06)';
    sumEl.style.borderColor='rgba(74,222,128,.2)';
    sumEl.style.color='#4ade80';
    sumEl.textContent=`🎉 Succès — ${totalInserted} séances insérées pour 7 profils démo.`;
  } else {
    sumEl.style.background='rgba(239,68,68,.06)';
    sumEl.style.borderColor='rgba(239,68,68,.2)';
    sumEl.style.color='#ef4444';
    sumEl.textContent=`⚠ ${totalFailed} profil(s) échoué(s) · ${totalInserted} séances insérées. Voir les détails ci-dessous.`;
  }

  btn.disabled=false;
  btn.textContent='🔄 Re-run Seed';
}
